name: Build and Push Docker Images

on:
  push:
    branches: [main, master]
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE: rajamummidi9/network-multitool

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            dockerfile: Dockerfile
          - name: extra
            dockerfile: Dockerfile.extra
          - name: openshift
            dockerfile: Dockerfile.openshift

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.name == 'minimal' }}
            type=raw,value=minimal,enable=${{ github.ref == 'refs/heads/main' && matrix.name == 'minimal' }}
            type=raw,value=extra,enable=${{ github.ref == 'refs/heads/main' && matrix.name == 'extra' }}
            type=raw,value=openshift,enable=${{ github.ref == 'refs/heads/main' && matrix.name == 'openshift' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') && matrix.name == 'minimal' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') && matrix.name == 'minimal' }}
            type=semver,pattern={{version}},suffix=-${{ matrix.name }},enable=${{ startsWith(github.ref, 'refs/tags/') && matrix.name != 'minimal' }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.name }},enable=${{ startsWith(github.ref, 'refs/tags/') && matrix.name != 'minimal' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
